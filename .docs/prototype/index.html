<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MayahTrip · protótipo interativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#15122E;--mut:#5E5A73;--pri:#2B207F;--pri2:#3B2F91;--lime:#C9FF27;--bg:#F4F3F8;--line:#E5E3EC;--soft:#EBE8FF;
--card:#fff;--line2:#EEECF3;--mapbg:#F0EEF6;--pri2t:#2B207F;--ease:cubic-bezier(.32,.72,0,1);--out:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.5,.5,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:#E7E5EE;display:flex;align-items:center;justify-content:center;gap:56px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block}
.ed{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em;line-height:1}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:700}
.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}.sb{justify-content:space-between}.f1{flex:1;min-width:0}
.kick{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- device ---------- */
.device{width:410px;height:864px;border-radius:56px;background:#0E0B22;padding:10px;box-shadow:0 0 0 2px #2A2650,0 40px 80px rgba(21,18,46,.28),0 12px 24px rgba(21,18,46,.18);flex-shrink:0;transform-origin:center}
#app{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;overflow:clip;background:var(--bg);isolation:isolate}
@media (max-width:520px){body{display:block;background:var(--bg)}.device{width:100vw;height:100dvh;border-radius:0;padding:0;box-shadow:none;transform:none!important}#app{width:100vw;height:100dvh;border-radius:0}.side{display:none!important}}

/* ---------- side panel ---------- */
.side{width:300px;display:flex;flex-direction:column;gap:14px}
.side h1{margin:0;font-size:40px}
.side p{margin:0;color:var(--mut);font-size:14px;line-height:1.55}
.side .flows{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.side .flows button{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;transition:transform .16s var(--out),border-color .2s}
.side .flows button:hover{border-color:#BDB8D6}
.side .flows button:active{transform:scale(.98)}
.side .flows .n{width:26px;height:26px;border-radius:9px;background:var(--soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.side .reset{align-self:flex-start;background:none;border:0;color:var(--pri);font-weight:700;font-size:13px;padding:4px 0}
@media (max-width:1000px){.side{display:none}}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;background:var(--bg);overflow:hidden;transition:transform .48s var(--ease),filter .48s var(--ease),opacity .3s var(--out);will-change:transform}
.screen.enter{transform:translateX(100%)}
.screen.enter-up{transform:translateY(100%)}
.screen.behind{transform:translateX(-26%);filter:brightness(.9)}
.screen.behind-modal{transform:scale(.94);filter:brightness(.8);border-radius:40px}
.screen.fade{opacity:0}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:56px 20px 130px}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px;scroll-snap-type:x proximity;scroll-padding-inline:20px}
.hs::after{content:'';flex:0 0 10px}
.hs::-webkit-scrollbar{display:none}
.hs>*{scroll-snap-align:start}

/* ---------- primitives ---------- */
.h1{font-size:30px;font-weight:800;letter-spacing:-.035em;margin:0;line-height:1.1}
.h2{font-size:19px;font-weight:800;letter-spacing:-.025em;margin:0}
.h3{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0}
.card{background:var(--card);border-radius:24px}
.btn{height:50px;padding:0 20px;border-radius:25px;border:0;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform .16s var(--out),background-color .2s,opacity .2s,box-shadow .2s}
.btn:active,.tap:active,.chip:active,.ib:active{transform:scale(.96)}
.tap{transition:transform .2s var(--out);cursor:pointer}
.b-pri{background:var(--pri);color:#fff}.b-pri:hover{background:var(--pri2)}
.b-lime{background:var(--lime);color:#15122E}.b-lime:hover{background:#B8E821}
.b-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.b-dark{background:var(--ink);color:#fff}
.btn[disabled]{opacity:.35;pointer-events:none}
.chip{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0;transition:transform .16s var(--out),background-color .2s,color .2s,border-color .2s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap}
.t-lime{background:#EEFFC2;color:#3A4D00}.t-pur{background:var(--soft);color:var(--pri)}.t-gray{background:#F0EFF4;color:var(--mut)}.t-red{background:#FFE6E0;color:#962A10}.t-dark{background:var(--ink);color:var(--lime)}
.av{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:2px solid #fff;flex-shrink:0}
.av+.av{margin-left:-9px}
.a1{background:var(--pri);color:#fff}.a2{background:#FF8A5B;color:var(--ink)}.a3{background:var(--lime);color:var(--ink)}.a4{background:#5BC0EB;color:var(--ink)}.a5{background:#F2C14E;color:var(--ink)}
.ib{width:44px;height:44px;border-radius:22px;border:0;background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .16s var(--out),background-color .2s}
.ib.glass{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.ib.soft{background:var(--bg)}
.srch{display:flex;align-items:center;gap:10px;height:54px;padding:0 8px 0 16px;border-radius:27px;background:#fff;border:1px solid var(--line);color:var(--mut);transition:border-color .2s,box-shadow .2s}
.srch:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px var(--soft)}
.srch input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:15px;color:var(--ink)}
.srch input::placeholder,.inp::placeholder{color:#7A768C}
.inp{height:52px;border-radius:16px;border:1px solid var(--line);background:#fff;padding:0 16px;font-size:15px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 4px var(--soft)}
.sec{display:flex;justify-content:space-between;align-items:baseline}
.sec button{background:none;border:0;font-size:14px;font-weight:700;color:var(--pri);padding:0}
.bar{height:8px;border-radius:4px;background:#ECEAF2;overflow:hidden}.bar>i{display:block;height:100%;border-radius:4px;background:var(--pri);transition:width .5s var(--out)}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block;flex-shrink:0}
.chk{width:30px;height:30px;border-radius:10px;border:2px solid #CFCCDA;background:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent;padding:0;transition:background-color .2s,border-color .2s,transform .25s var(--spring)}
.chk.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chk.on svg{animation:pop .3s var(--spring)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.thumb{border-radius:16px;overflow:hidden;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9)}
.thumb img{width:100%;height:100%;object-fit:cover}
.seg{display:flex;gap:4px;padding:4px;border-radius:18px;background:#E9E7F0}
.seg button{flex:1;height:42px;border-radius:14px;border:0;background:transparent;color:var(--mut);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;transition:background-color .2s,color .2s,box-shadow .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(21,18,46,.12)}
.switch{flex-shrink:0;width:50px;height:30px;border-radius:15px;border:0;padding:3px;display:flex;background:#D5D3DE;transition:background-color .2s}
.switch span{width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.switch.on{background:var(--pri)}.switch.on span{transform:translateX(20px)}
.lnk{background:none;border:0;padding:0;color:var(--pri);font-weight:700}

/* video / editorial card */
.vc{position:relative;border-radius:26px;overflow:hidden;color:#fff;flex-shrink:0;cursor:pointer;background:#222;transition:transform .25s var(--out)}
.vc:active{transform:scale(.98)}
.vc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 6s linear}
.vc:hover img{transform:scale(1.06)}
.vc .fade{position:absolute;left:0;right:0;bottom:0;height:72%;background:linear-gradient(to top,rgba(12,10,28,.94) 0%,rgba(12,10,28,.5) 45%,rgba(12,10,28,0) 100%)}
.vc .meta{position:absolute;left:16px;right:16px;bottom:16px}
.vc .kick{color:var(--lime)}
.pb{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:17px;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;color:#fff}
.dur{position:absolute;top:12px;left:12px;height:24px;padding:0 8px;border-radius:12px;background:rgba(12,10,28,.55);font-size:11px;font-weight:700;color:#fff;display:flex;align-items:center;gap:4px}

/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:88px;padding:0 8px 22px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid #ECEAF2;display:flex;justify-content:space-around;align-items:center;z-index:20;transition:transform .45s var(--ease),background-color .3s}
.nav.hide{transform:translateY(110%)}
.nav.dark{background:rgba(12,10,28,.9);border-top-color:rgba(255,255,255,.08)}
.nav>button{width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#6E6A82;background:none;border:0;padding:6px 0;transition:color .2s,transform .16s var(--out)}
.nav>button:active{transform:scale(.92)}
.nav>button.on{color:var(--pri)}
.nav.dark>button{color:#A9A6BC}.nav.dark>button.on{color:#fff}
.nav .fab{width:54px;height:54px;border-radius:20px;background:var(--pri);color:var(--lime);justify-content:center;box-shadow:0 8px 20px rgba(43,32,127,.35);padding:0}
.nav.dark .fab{color:var(--lime)}

/* maya bubble */
.maya{position:absolute;right:16px;bottom:104px;z-index:19;height:52px;padding:0 18px 0 8px;border-radius:26px;border:0;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;box-shadow:0 12px 28px rgba(21,18,46,.3);transition:transform .45s var(--ease),opacity .3s,bottom .45s var(--ease)}
.maya .mi{display:none}
.maya.hide{transform:translateY(160px);opacity:0;pointer-events:none}
.maya.low{bottom:24px}
.maya.mini{padding:0 8px;width:52px;justify-content:center}.maya.mini .ml{display:none}
.maya:active{transform:scale(.95)}

/* sheets */
.ov{position:absolute;inset:0;background:rgba(21,18,46,.5);z-index:40;opacity:0;transition:opacity .4s var(--ease)}
.ov.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:#fff;border-radius:30px 30px 0 0;z-index:41;transform:translateY(100%);transition:transform .5s var(--ease);display:flex;flex-direction:column;box-shadow:0 -16px 48px rgba(21,18,46,.2)}
.sheet.show{transform:translateY(0)}
.sheet.drag{transition:none}
.sheet .grabber{padding:10px 0 6px;cursor:grab;touch-action:none;flex-shrink:0}
.sheet .grabber i{display:block;width:40px;height:5px;border-radius:3px;background:#DAD8E2;margin:0 auto}
.sheet .sbody{overflow-y:auto;padding:6px 20px 34px;scrollbar-width:none}
.sheet .sbody::-webkit-scrollbar{display:none}
.sheet.tall{height:88%}.sheet.tall .sbody{flex:1}
.sheet.gray{background:var(--bg)}
.grip{flex-shrink:0;width:22px;align-self:stretch;margin:-6px 0 -6px -6px;padding:0;border:0;border-radius:10px;background:none;color:#BDB8D6;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;transition:color .2s,background-color .2s}
.grip:hover{color:var(--pri);background:var(--bg)}.grip:active{cursor:grabbing}.grip:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.actItem{position:relative;transition:transform .24s var(--ease)}
.actItem.dragging{transition:none;z-index:6}
.actItem.dragging .act{transform:scale(1.02);box-shadow:0 18px 40px rgba(21,18,46,.2);transition:transform .2s var(--spring),box-shadow .2s}
.act{transition:transform .2s var(--out),box-shadow .2s}
#acts.sorting .leg{opacity:0}
.leg{transition:opacity .15s}
.actItem.removing{transition:height .26s var(--ease),opacity .2s;overflow:hidden;opacity:0}
.rm{width:30px;height:30px;border-radius:15px;border:0;background:none;color:#9A97AB;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:color .2s,background-color .2s}
.rm:hover{color:#D2462A;background:#FFE6E0}
#app.dark .rm:hover{background:#3A1F1A}
#app.dark .grip{color:#45406A}
.pstat{gap:4px;border:0;background:none;padding:4px 0;color:inherit;font:inherit}
.cmt-foot{position:sticky;bottom:0;margin:12px -20px 0;padding:10px 20px 12px;background:var(--card);border-top:1px solid var(--line2);box-shadow:0 40px 0 var(--card);z-index:2}
.livedot{animation:live 1.4s ease-in-out infinite}@keyframes live{50%{opacity:.25}}
.jicon{background:var(--pri);color:var(--lime);box-shadow:0 4px 10px rgba(43,32,127,.18)}
.stat:hover .jicon{transform:rotate(-6deg) scale(1.06)}
.jicon{transition:transform .25s var(--spring)}
.otpbox{width:62px;height:70px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);text-align:center;font-size:30px;font-weight:800;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s,transform .2s var(--spring)}
.otpbox:focus{border-color:var(--pri);box-shadow:0 0 0 4px var(--soft)}
.otpbox.filled{border-color:var(--pri);transform:translateY(-2px)}
.otpbox.err{border-color:#D2462A}
.otpbox.ok{border-color:#3A9A2E;background:#EEFFC2;color:#15122E}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pop{animation:pop .5s var(--spring)}
.lg-sheet .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:20px;border:0;background:transparent;color:var(--mut);display:flex;align-items:center;justify-content:center}
/* ===== dark mode ===== */
#app{transition:background-color .4s}
#app.dark{--bg:#0E0C1D;--ink:#F1EFFA;--mut:#A6A2BC;--line:#2B2747;--line2:#221F3B;--soft:#26214D;--card:#19162E;--mapbg:#131126;--pri2t:#C9FF27;color:var(--ink);background:var(--bg)}
#app.dark .screen{background:var(--bg)}
#app.dark .ib:not(.glass){background:var(--card);color:var(--ink)}
#app.dark .ib.soft{background:#24203E}
#app.dark .ib.glass{color:#15122E}
#app.dark [style*="background:#F8F7FF"]{background:#26214D!important}
#app.dark [style*="background:#FFF1EC"]{background:#3A1F1A!important}
#app.dark .chip{background:var(--card);border-color:var(--line);color:var(--ink)}
#app.dark .chip.on{background:var(--ink);color:#15122E;border-color:var(--ink)}
#app.dark .b-ghost{background:var(--card);border-color:var(--line);color:var(--ink)}
#app.dark .b-dark{background:#2B207F;color:#fff}
#app.dark .srch,#app.dark .inp{background:var(--card);border-color:var(--line);color:var(--ink)}
#app.dark .srch input{color:var(--ink)}
#app.dark .seg{background:#1D1A33}
#app.dark .seg button.on{background:#2C2850;color:#fff;box-shadow:none}
#app.dark .nav{background:rgba(18,16,34,.92);border-top-color:var(--line)}
#app.dark .nav>button.on{color:var(--lime)}
#app.dark .sheet{background:var(--card);box-shadow:0 -16px 48px rgba(0,0,0,.5)}
#app.dark .sheet.gray{background:var(--bg)}
#app.dark .toast{background:#2B207F}
#app.dark .maya{background:#2B207F}
#app.dark .t-dark{background:#2B207F;color:var(--lime)}
#app.dark .t-gray{background:#24203E;color:var(--mut)}
#app.dark .t-pur{background:#26214D;color:#C9C1FF}
#app.dark .chk{background:var(--card);border-color:#45406A}
#app.dark .chk.on{background:var(--lime);border-color:var(--lime);color:#15122E}
#app.dark .bar,#app.dark .cbar{background:#2B2747}
#app.dark .keys button{background:#24203E;color:var(--ink)}
#app.dark .lnk,#app.dark .sec button{color:#C9C1FF}
#app.dark .cal button{color:var(--ink)}
#app.dark .cal button.in{background:#26214D}
#app.dark .msg.ai{background:var(--card)}
#app.dark .gbtn{background:var(--card);border-color:var(--line);color:var(--ink)}
#app.dark .switch{background:#3A3560}
#app.dark .chat-foot{background:var(--bg);border-top-color:var(--line)}
#app.dark .chat-head{border-bottom-color:var(--line)}
#app.dark [style*="background:#fff"]:not([style*="color:#15122E"]){background:var(--card)!important}
#app.dark [style*="background:var(--ink)"]{background:#221D42!important;color:#fff}
#app.dark [style*="background:var(--lime)"]{color:#15122E!important}
#app.dark [style*="color:var(--pri)"]:not([style*="background:var(--pri)"]){color:#C9C1FF!important}
#app.dark [style*="color:#2B207F"]{color:#C9C1FF!important}
#app.dark [style*="background:var(--soft)"]{color:#C9C1FF}
#app.dark [style*="background:#F0EFF4"],#app.dark [style*="background:#E9E7F0"]{background:#24203E!important}
#app.dark [style*="background:#EBE8FF"]{background:#26214D!important}
#app.dark [style*="background:var(--bg)"]{background:#14122A!important}
#app.dark [style*="border:1px solid var(--line)"]{border-color:var(--line)!important}
#app.dark [style*="border:1px dashed #BDB8D6"],#app.dark [style*="border:1.5px dashed #BDB8D6"],#app.dark [style*="border:2px dashed #CFCCDA"]{border-color:#3D3860!important}
#app.dark .lg-sheet{background:var(--card)}
#app.dark [style*="background:#F1FFD1"]{background:#1F2610!important}
#app.dark [style*="color:#2C3A00"]{color:#E3F7A8!important}
#app.dark [style*="background:#F1FFD1"] .lnk{color:#C9FF27}
#app.dark .mapw{background:#131126}
#app.dark .wallet-ov{background:var(--bg)}
.wallet-ov{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:background-color .45s var(--out),opacity .4s}
.wallet-ov.done{background:transparent;opacity:0;pointer-events:none}
.wallet{position:relative;width:260px;height:180px;margin-top:40px;animation:wpop .55s var(--spring) both}
@keyframes wpop{from{opacity:0;transform:scale(.7) translateY(20px)}to{opacity:1;transform:none}}
.w-back{position:absolute;left:0;right:0;bottom:0;height:160px;border-radius:32px;background:#1E1760;transition:opacity .4s,transform .45s var(--ease)}
.w-front{position:absolute;left:0;right:0;bottom:0;height:116px;border-radius:30px;background:#2B207F;z-index:5;padding:22px 24px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 -6px 18px rgba(18,15,42,.25);transition:opacity .4s,transform .45s var(--ease)}
.w-front:after{content:'';position:absolute;inset:9px;border-radius:23px;border:1.5px dashed rgba(255,255,255,.22);pointer-events:none}
.w-clasp{position:absolute;right:-10px;top:26px;width:70px;height:46px;border-radius:16px;background:#C9FF27;display:flex;align-items:center;justify-content:flex-start;padding-left:14px;box-shadow:0 4px 12px rgba(0,0,0,.2)}

.wcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wcard .wshade{position:absolute;inset:0;background:linear-gradient(to top,rgba(12,10,28,.85),rgba(12,10,28,0) 60%)}

.wallet-ov.done .wcard{opacity:0}
.wl-list{opacity:0}.wl-list.show{opacity:1;transition:opacity .35s var(--out)}
.mapw{position:relative;border-radius:26px;overflow:hidden;background:#EEF0F7;touch-action:none;cursor:grab}
.mapw:active{cursor:grabbing}
.mapw .cty{transition:fill .25s,opacity .2s;cursor:pointer}.mapw .cty:hover{opacity:.82}
.mz{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mz button{width:36px;height:36px;border-radius:12px;border:0;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(21,18,46,.12);color:var(--ink)}
.cbar{height:10px;border-radius:5px;background:#ECEAF2;overflow:hidden;display:flex}
.cbar i{display:block;height:100%;transition:width .6s var(--out)}
/* splash */
.splash{position:absolute;inset:0;background:#120F2A;color:#fff;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.splash .trail{position:absolute;inset:0;width:100%;height:100%}
.splash .trail path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.65,0,.35,1) .1s forwards,trailfade .8s ease 1.6s forwards}
@keyframes trailfade{to{opacity:.12}}
.lgdot{opacity:0;transform-box:fill-box;transform-origin:center;animation:dotin .5s var(--spring) forwards}
@keyframes dotin{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.lgplane{opacity:0;animation:planein .8s cubic-bezier(.2,.9,.25,1.15) .95s forwards}
@keyframes planein{from{opacity:0;transform:translate(-18px,18px) rotate(-8deg)}to{opacity:1;transform:none}}
.sp-word{overflow:hidden;margin-top:18px}
.sp-word>*{display:block;transform:translateY(110%);animation:wordup .7s var(--ease) 1.35s forwards}
@keyframes wordup{to{transform:none}}
.sp-tag{opacity:0;margin-top:14px;font-size:22px;color:#C9C6DA;animation:fadeup .7s var(--ease) 1.7s forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sp-bar{position:absolute;left:50%;bottom:64px;width:120px;height:3px;margin-left:-60px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:#C9FF27;border-radius:2px;animation:spbar 2.3s cubic-bezier(.4,0,.2,1) .2s forwards}
@keyframes spbar{to{width:100%}}
.splash.out .sp-center{animation:spout .55s var(--ease) forwards}
@keyframes spout{to{opacity:0;transform:scale(1.08)}}
/* login */
.lg-photos{position:absolute;inset:0;overflow:hidden;background:#120F2A}
.lg-photos img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:lgfade 20s linear infinite}
.lg-cap{position:absolute;opacity:0;animation:lgfade 20s linear infinite}
@keyframes lgfade{0%{opacity:0;transform:scale(1.12)}3%{opacity:1}22%{opacity:1}26%{opacity:0;transform:scale(1)}100%{opacity:0}}
.lg-cap{transform:none!important}
.lg-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(18,15,42,.55) 0%,rgba(18,15,42,0) 22%,rgba(18,15,42,.2) 40%,rgba(18,15,42,.85) 70%,rgba(18,15,42,.95) 100%)}
.lg-sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:32px 32px 0 0;padding:26px 22px 34px;box-shadow:0 -12px 40px rgba(18,15,42,.25);animation:sheetup .7s var(--ease) both}
@keyframes sheetup{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
.lg-in{animation:rise .45s var(--ease) both}
.gbtn{height:54px;border-radius:27px;border:1px solid var(--line);background:#fff;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:15px;transition:transform .16s var(--out),background-color .2s}
.gbtn:hover{background:#FAFAFC}.gbtn:active{transform:scale(.97)}
.divider{display:flex;align-items:center;gap:12px;color:#8C889E;font-size:12px;font-weight:600}
.divider:before,.divider:after{content:'';flex:1;height:1px;background:var(--line)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:20px;border:0;background:transparent;color:var(--mut);display:flex;align-items:center;justify-content:center}
.mapbox{position:relative;height:480px;border-radius:26px;overflow:hidden;background:#ECE8DF;box-shadow:0 1px 2px rgba(21,18,46,.06),0 10px 28px rgba(21,18,46,.08)}
.mapbox>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.route{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s var(--ease) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pin{cursor:pointer;transition:transform .3s var(--spring)}
.pin .ring{animation:ring 1.6s var(--out) infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.pinin{animation:pinin .45s var(--spring) both}
@keyframes pinin{from{opacity:0;transform:translateY(-10px) scale(.6)}to{opacity:1;transform:none}}
.mapcard{position:absolute;left:12px;right:12px;bottom:12px;background:#fff;border-radius:20px;padding:10px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(21,18,46,.18);animation:rise .35s var(--ease)}
.maptop{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}

.mapchip{height:34px;padding:0 12px;border-radius:17px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border:0;box-shadow:0 2px 8px rgba(21,18,46,.1);white-space:nowrap}
.sheet.chat .sbody{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:4px 0 0}
.chat-head{padding:0 20px 12px;border-bottom:1px solid var(--line)}
.chat-log{flex:1;min-height:0;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.chat-log::-webkit-scrollbar{display:none}
.chat-foot{padding:12px 20px 30px;border-top:1px solid var(--line);background:var(--bg)}
.chat-foot .hs{margin:0 -20px 10px}
.mavatar{border-radius:50%;background:#E9E4FF;overflow:hidden;flex-shrink:0;display:inline-flex}

.airow{display:flex;gap:8px;align-items:flex-end;align-self:flex-start;max-width:92%}
.airow .msg{max-width:none}

/* toasts */
.toasts{position:absolute;left:16px;right:16px;bottom:110px;z-index:60;display:flex;flex-direction:column-reverse;align-items:center;gap:8px;pointer-events:none}
.toasts.top{top:56px;bottom:auto;flex-direction:column}
.toast{pointer-events:auto;min-height:48px;padding:10px 10px 10px 16px;border-radius:18px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;box-shadow:0 12px 32px rgba(21,18,46,.3);animation:tin .45s var(--ease);max-width:100%}
.toast.out{animation:tout .3s var(--out) forwards}
.toast .ti{width:26px;height:26px;border-radius:13px;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast button{height:32px;padding:0 12px;border-radius:16px;border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:13px}
@keyframes tin{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(12px) scale(.96)}}

/* animations */
.stagger>*{animation:rise .5s var(--ease) both}

.step-f{animation:stepF .42s var(--ease) both}.step-b{animation:stepB .42s var(--ease) both}

.flash{animation:flash 1.4s var(--out)}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:4px;text-align:center}
.cal .wd{font-size:12px;font-weight:700;color:#8C889E;padding:6px 0}

.cal button span{position:relative;z-index:1;width:44px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;transition:background-color .15s,color .15s}

.cal button.s span,.cal button.e span{background:var(--pri);color:#fff}
.cal button.past{color:#C4C1D2;pointer-events:none}
.cal button:hover span{background:#F0EFF4}
.cal button.s:hover span,.cal button.e:hover span{background:var(--pri)}

.feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000}
.feed::-webkit-scrollbar{display:none}
.post{position:relative;height:100%;scroll-snap-align:start;overflow:hidden;color:#fff}
.post>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.02);transition:transform 9s linear}
.post.active>img{transform:scale(1.14)}
.post .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(12,10,28,.55) 0%,rgba(12,10,28,0) 20%,rgba(12,10,28,0) 32%,rgba(12,10,28,.62) 55%,rgba(12,10,28,.95) 100%)}

.post .prog:active{transform:scale(.9)}
.post .prog svg.rg{position:absolute;inset:0;transform:rotate(-90deg)}
.post .prog .pc{stroke-dasharray:138.2;stroke-dashoffset:138.2}
.post.active .prog .pc{animation:ringp 9s linear forwards}

.post .prog .ar{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-1px)}50%{transform:translateY(2px)}}
@keyframes prog{to{width:100%}}
.rail{position:absolute;right:12px;bottom:290px;display:flex;flex-direction:column;gap:16px;align-items:center}
.rail button{border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:0;transition:transform .16s var(--out)}
.rail button:active{transform:scale(.9)}
.rail .rb{width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}

/* keypad */
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.keys button{height:52px;border-radius:16px;border:0;background:var(--bg);font-size:22px;font-weight:600;transition:transform .12s var(--out),background-color .15s}

function push(name,params,modal){
const prev=cur();const o=mk(name,params);o.modal=!!modal;

requestAnimationFrame(()=>requestAnimationFrame(()=>{o.el.classList.remove('enter','enter-up');if(prev)prev.el.classList.add(modal?'behind-modal':'behind')}));
chrome();
}
function pop(){
if(S.stack.length<2)return;
const o=S.stack.pop();const prev=cur();
o.el.classList.add(o.modal?'enter-up':'enter');prev.el.classList.remove('behind','behind-modal');

function refreshSheet(){if(!sheetEls)return;const b=sheetEls.sh.querySelector('.sbody');const st=b.scrollTop;b.innerHTML=sheetFn();b.scrollTop=st}
function closeSheet(instant){
if(!sheetEls)return;const {ov,sh}=sheetEls;sheetEls=null;sheetFn=null;
if(instant){ov.remove();sh.remove();return}
ov.classList.remove('show');sh.classList.remove('show','drag');sh.style.transform='';
setTimeout(()=>{ov.remove();sh.remove();chrome()},460);
}
function dragify(sh){
const g=sh.querySelector('.grabber');let y0=null,dy=0,t0=0;
g.addEventListener('pointerdown',e=>{y0=e.clientY;t0=Date.now();dy=0;sh.classList.add('drag');g.setPointerCapture(e.pointerId)});
g.addEventListener('pointermove',e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translateY(${dy}px)`});
const end=()=>{if(y0===null)return;const v=dy/(Date.now()-t0);y0=null;sh.classList.remove('drag');if(dy>110||v>.6){closeSheet()}else{sh.style.transform=''}};
g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
}
/* toast */
function toast(msg,action,fn){
const t=document.createElement('div');t.className='toast';
t.innerHTML=`<span class="ti">${ic('check',14)}</span><span class="f1">${msg}</span>${action?`<button>${action}</button>`:''}`;
if(action)t.querySelector('button').onclick=()=>{fn&&fn();kill()};
toastsEl.append(t);
while(toastsEl.children.length>2)toastsEl.firstChild.remove();
const kill=()=>{t.classList.add('out');setTimeout(()=>t.remove(),300)};
setTimeout(kill,3200);
}

function setupMap(el){const w=el.querySelector('#mapw');if(!w)return;const g=()=>w.querySelector('.wg');S.mv=S.mv||{k:1,x:0,y:0};

let st=null;window._dragged=false;
w.addEventListener('pointerdown',e=>{if(e.target.closest('.mz'))return;st={x:e.clientX,y:e.clientY,ox:S.mv.x,oy:S.mv.y};window._dragged=false});
w.addEventListener('pointermove',e=>{if(!st)return;const svg=w.querySelector('svg');const r=1000/svg.getBoundingClientRect().width;const dx=(e.clientX-st.x)*r,dy=(e.clientY-st.y)*r;if(Math.abs(dx)+Math.abs(dy)>8)window._dragged=true;if(window._dragged){S.mv.x=st.ox+dx;S.mv.y=st.oy+dy;apply()}});
const end=()=>{st=null;setTimeout(()=>window._dragged=false,30)};w.addEventListener('pointerup',end);w.addEventListener('pointerleave',end);

function zoomMap(d){S.mv=S.mv||{k:1,x:0,y:0};const m=S.mv;if(d===0){m.k=1;m.x=0;m.y=0}else{const nk=Math.max(1,Math.min(6,m.k*(d>0?1.5:1/1.5)));const cx=500,cy=250;m.x=cx-(cx-m.x)*nk/m.k;m.y=cy-(cy-m.y)*nk/m.k;m.k=nk;if(nk===1){m.x=0;m.y=0}}

function mapSVG(t,d){
const W=350,H=480;const pts=d.acts.map((a,i)=>({a,i,p:PL[a.p]})).filter(x=>x.p.ll);
if(!pts.length)return '';
const city=d.city||t.dest[0];const lat0=pts.reduce((s,x)=>s+x.p.ll[0],0)/pts.length;const kx=Math.cos(lat0*Math.PI/180);
const pr=ll=>[ll[1]*kx,-ll[0]];
let xs=pts.map(x=>pr(x.p.ll)[0]),ys=pts.map(x=>pr(x.p.ll)[1]);
let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
const minS=.012;if(x1-x0<minS){const c=(x0+x1)/2;x0=c-minS/2;x1=c+minS/2}if(y1-y0<minS){const c=(y0+y1)/2;y0=c-minS/2;y1=c+minS/2}
const padL=44,padR=44,padT=70,padB=140;const sc=Math.min((W-padL-padR)/(x1-x0),(H-padT-padB)/(y1-y0));

function relegs(d){d.acts.forEach((a,i)=>{a.leg=i?legFor(d.acts[i-1].p,a.p):null})}
function moveAct(from,to){const t=trip(cur().params.id);const d=t.days[t.day];if(to<0||to>=d.acts.length||to===from)return;const old=d.acts.map(a=>({...a}));const times=d.acts.map(a=>a.t);const [m]=d.acts.splice(from,1);d.acts.splice(to,0,m);clearNew(t);d.acts.forEach((a,i)=>a.t=times[i]);relegs(d);m.isNew=true;t.mapSel=0;refresh();setTimeout(()=>{const g=cur().el.querySelector(`[data-grip="${to}"]`);if(S._kbSort&&g)g.focus();S._kbSort=false},40);toast(PL[m.p].n+' agora é a parada '+(to+1),'Desfazer',()=>{d.acts=old;refresh()})}

let FEEDP=[];
const CUSERS={'marina.viaja':'a4','duda.trips':'a2','lia.viaja':'a3','rafa.londres':'a5','bia.emparis':'a1','cadu.come':'a2','ana.mochila':'a3','pedro.voa':'a5','gabi.roteiros':'a4','theo.viaja':'a1','nina.passaporte':'a2','leo.malas':'a5'};
const CPOOL=['Fui em outubro e confirmo: chegar cedo faz toda a diferença.','Salvei para a minha viagem de março!','Quanto tempo vocês ficaram lá?','Essa dica do horário é ouro.','Dá para ir com criança pequena?','A foto não faz justiça, ao vivo é ainda mais bonito.','Comprei o ingresso online como você falou e não peguei fila nenhuma.','Tem opção vegetariana por perto?','Fui no fim da tarde e estava lotado, da próxima vou de manhã.','Que luz! Qual câmera você usou?','Adicionei no meu roteiro agora mesmo.','Vale a pena no inverno também?'];
const CWHEN=['2 h','5 h','ontem','2 dias','3 dias','1 sem','2 sem'];
function hsh(k){let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))>>>0;return h}
function postMeta(key){if(key[0]==='f'){const x=FEEDP[+key.slice(1)];return {author:x?x[1].slice(1):'',own:false,likes:x?x[5]:'0',likesN:null,total:40+(+key.slice(1)*53)%160,title:x?x[2]:''}}const x=S.myPosts.find(y=>'m'+y.id===key)||{};return {author:'me',own:true,likes:fmtN(x.likes||0),likesN:x.likes||0,total:x.com||0,title:x.place?x.place+' · '+x.city:''}}
function comData(key){S.comments=S.comments||{};if(!S.comments[key]){S.comments[key]={list:[],total:postMeta(key).total,loaded:0};moreCom(key)}return S.comments[key]}
function moreCom(key){const C=S.comments[key];const h=hsh(key);const us=Object.keys(CUSERS);const n=Math.min(8,C.total-C.loaded);for(let j=C.loaded;j<C.loaded+n;j++){const u=us[(h+j*5)%us.length];const m=postMeta(key);C.list.push({u,t:CPOOL[(h+j*7)%CPOOL.length],when:CWHEN[Math.min(j,CWHEN.length-1)],likes:(h+j*37)%90,liked:false,replies:j%4===1?[{u:m.author==='me'?'me':m.author,t:'Obrigado! Pode ir tranquilo, vale muito.',when:CWHEN[Math.min(j,CWHEN.length-1)],likes:(h+j)%20,liked:false}]:[]})}C.loaded+=n}
function comCount(key){const C=S.comments&&S.comments[key];return fmtN(C?C.total:postMeta(key).total)}
function likers(key){const h=hsh(key);const us=Object.keys(CUSERS);const out=[];for(let j=0;j<10;j++){const u=us[(h+j*3)%us.length];if(!out.includes(u))out.push(u)}return out}
function cAv(u,sz){return u==='me'?userAv(sz):`<span class="av ${CUSERS[u]||'a4'}" style="width:${sz}px;height:${sz}px;border:0;font-size:${Math.round(sz*.4)}px">${u[0].toUpperCase()}</span>`}
function cName(u){return u==='me'?esc(S.user.name)+' <span class="mut" style="font-weight:500">(você)</span>':'@'+u}
function openPostSheet(key,tab){S.pTab=tab||'com';S.replyTo=null;comData(key);
openSheet(()=>{const m=postMeta(key);const C=comData(key);const vis=C.list.map((c,i)=>({c,i})).filter(o=>!S.blocked[o.c.u]);
const row=(c,id,isReply)=>{const canDel=c.u==='me'||m.own;return `<div class="row" style="gap:10px;align-items:flex-start;padding:${isReply?'10px 0 0 42px':'12px 0'}">${cAv(c.u,isReply?26:32)}<div class="f1 col" style="gap:3px"><span class="xs"><b>${cName(c.u)}</b>${c.u===m.author&&c.u!=='me'?' <span class="tag t-pur" style="height:18px;font-size:10px;padding:0 6px">Autor</span>':''} <span class="mut">· ${c.when}</span></span><span class="sm" style="line-height:1.45">${esc(c.t)}</span><span class="row xs mut" style="gap:14px;margin-top:2px">${isReply?'':`<button class="lnk xs" data-a="cReply" data-v="${id}" style="padding:2px 0;color:var(--mut)">Responder</button>`}${canDel?`<button class="lnk xs" data-a="cDel" data-v="${id}" style="padding:2px 0;color:#D2462A">${c.u==='me'?'Excluir':'Remover'}</button>`:''}</span></div><button class="col tap" data-a="cLike" data-v="${id}" aria-label="Curtir comentário" aria-pressed="${c.liked}" style="border:0;background:none;align-items:center;gap:2px;padding:4px;color:${c.liked?'#FF5A6A':'var(--mut)'}">${ic(c.liked?'heartf':'heart',16)}<span style="font-size:11px">${c.likes+(c.liked?1:0)||''}</span></button></div>`};
const likeList=[...(m.own?[]:(S.liked[+key.slice(1)]?['me']:[])),...likers(key)].filter(u=>!S.blocked[u]);
const likeTotal=m.own?m.likes:m.likes;
return `${sheetHead(m.own?'Sua publicação':'@'+m.author,esc(m.title))}
<div class="seg" style="margin-bottom:6px"><button class="${S.pTab==='com'?'on':''}" data-a="pTab" data-v="com">${ic('chat',16)}Comentários · ${fmtN(C.total)}</button><button class="${S.pTab==='likes'?'on':''}" data-a="pTab" data-v="likes">${ic('heart',16)}Curtidas · ${likeTotal}</button></div>
${S.pTab==='com'?`${vis.length?vis.map(({c,i},k)=>`<div style="${k?'border-top:1px solid var(--line2)':''}">${row(c,i,false)}${c.replies.filter(r=>!S.blocked[r.u]).map((r,ri)=>row(r,i+'.'+c.replies.indexOf(r),true)).join('')}</div>`).join(''):`<div class="col" style="padding:28px 0;align-items:center;text-align:center;gap:6px"><span class="h3">Nenhum comentário ainda</span><span class="sm mut">Seja a primeira pessoa a comentar.</span></div>`}
${C.loaded<C.total?`<button class="btn b-ghost" data-a="cMore" style="width:100%;height:44px;margin-top:8px;font-size:13px">Ver mais comentários (${fmtN(C.total-C.loaded)})</button>`:''}
<form class="cmt-foot col" data-form="comment" style="gap:8px">${S.replyTo?`<div class="row xs" style="gap:8px"><span class="f1 mut">Respondendo a <b style="color:var(--ink)">${S.replyTo.u==='me'?'você':'@'+S.replyTo.u}</b></span><button type="button" class="lnk xs" data-a="cReplyX">Cancelar</button></div>`:''}<div class="row" style="gap:8px">${userAv(36)}<label class="f1"><span class="sr">Comentário</span><input class="inp" name="c" maxlength="500" autocomplete="off" placeholder="${S.replyTo?'Escreva sua resposta':'Adicione um comentário'}" style="height:46px"></label><button class="ib" aria-label="Enviar comentário" style="width:46px;height:46px;background:var(--pri);color:#fff;border-radius:23px">${ic('send',18)}</button></div></form>`
:`${likeList.map((u,k)=>`<div class="row" style="gap:12px;padding:10px 0;${k?'border-top:1px solid var(--line2)':''}">${cAv(u,40)}<span class="f1 col"><span class="sm b">${u==='me'?esc(S.user.name)+' (você)':'@'+u}</span><span class="xs mut">${u==='me'?'Você curtiu':USERS[u]?USERS[u].name:'Viajante'}</span></span>${u==='me'?'':`<button class="btn ${S.following[u]?'b-ghost':'b-pri'}" data-a="follow" data-v="${u}" style="height:34px;padding:0 14px;font-size:13px">${S.following[u]?'Seguindo':'Seguir'}</button>`}</div>`).join('')||'<div class="sm mut" style="padding:20px 0">Ninguém curtiu ainda.</div>'}
${(m.own?m.likesN:999)>likeList.length?`<p class="xs mut" style="text-align:center;margin:12px 0 0">e outras pessoas · total ${likeTotal}</p>`:''}`}`},'tall');
const pick=id=>{const [a,b]=String(id).split('.');const c=comData(key).list[+a];return b===undefined?{c,arr:comData(key).list,ix:+a,top:true}:{c:c.replies[+b],arr:c.replies,ix:+b,top:false}};
A.pTab=v=>{S.pTab=v;refreshSheet()};
A.cMore=()=>{moreCom(key);refreshSheet()};
A.cLike=v=>{const o=pick(v);o.c.liked=!o.c.liked;refreshSheet()};
A.cReply=v=>{const o=pick(v);S.replyTo={i:o.ix,u:o.c.u};refreshSheet();const el=sheetEls.sh.querySelector('[name=c]');if(el)el.focus()};
A.cReplyX=()=>{S.replyTo=null;refreshSheet()};
A.cDel=v=>{const o=pick(v);const C=comData(key);const [x]=o.arr.splice(o.ix,1);if(o.top){C.total--;C.loaded--}if(S.replyTo&&o.top&&S.replyTo.i===o.ix)S.replyTo=null;refreshSheet();refresh();toast(x.u==='me'?'Comentário excluído':'Comentário removido','Desfazer',()=>{o.arr.splice(o.ix,0,x);if(o.top){C.total++;C.loaded++}refreshSheet();refresh()})};
A._comment=txt=>{const C=comData(key);const c={u:'me',t:txt,when:'agora',likes:0,liked:false,replies:[]};if(S.replyTo){C.list[S.replyTo.i].replies.push(c);S.replyTo=null}else{C.list.unshift(c);C.total++;C.loaded++}refreshSheet();refresh();const b=sheetEls.sh.querySelector('.sbody');if(b&&!C.list[0].replies.includes(c))b.scrollTop=0}}

'Qual a diferença entre as opções?':['Sugerido: montamos para você. Comunidade: você parte do roteiro de alguém que já foi. Do zero: dias vazios para você preencher.',''],
};
function ask(q){S.chat.push({t:esc(q)});S.chat.push({ai:1,typing:1});refreshSheet();scrollChat(true);
setTimeout(()=>{S.chat.pop();const a=ANS[q]||['Boa pergunta! No app real eu responderia usando o contexto da sua viagem. Aqui as respostas são simuladas.',''];S.chat.push({ai:1,t:a[0],act:a[1]});if(sheetEls){refreshSheet();scrollChat(true)}},900)}
A.ask=v=>ask(v);

/* ================= guest guards ================= */
function needAccount(why,k,v){S.pending=k?{k,v}:null;closeSheet(true);
openSheet(()=>`<div class="col" style="align-items:center;text-align:center;gap:10px;padding-top:4px">
<span class="row" style="gap:10px">${logoIcon(34)}${wordmark(120,'#15122E')}</span>
<h2 class="ed" style="margin:8px 0 0;font-size:34px;line-height:1.05">Crie sua conta para ${why}</h2>
<p class="sm mut" style="margin:0;max-width:290px;line-height:1.5">É grátis e leva 10 segundos. Tudo que você explorou continua aqui.</p>
<div class="col" style="gap:10px;width:100%;margin-top:10px">
<button class="gbtn" data-a="upgradeGo"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg>Continuar com Google</button>
<button class="btn b-pri" data-a="upgradeGo" style="width:100%;height:54px;border-radius:27px">${ic('mail',18)}Criar com e-mail</button>
<button class="lnk sm" data-a="closeSheet" style="margin-top:4px;padding:8px">Continuar explorando</button></div></div>`)}
A.needAcc=v=>needAccount(v);
const GUARD={follow:'seguir viajantes',wcreate:'criar sua viagem',quickExp:'lançar gastos',quickStop:'montar seu roteiro',insert:'salvar no seu roteiro',save:'salvar lugares',publish:'publicar reviews',like:'curtir e seguir viajantes',actRate:'avaliar paradas'};
Object.entries(GUARD).forEach(([k,why])=>{const f=A[k];A[k]=(v,el)=>S.guest?needAccount(why,k,v):f(v,el)});
{const f=A.tab;A.tab=(v,el)=>S.guest&&v==='profile'?needAccount('ter seu perfil','tab','profile'):f(v,el)}
/* ================= otp / password helpers ================= */
function updMeter(v){const m=document.getElementById('pwm');if(m)m.outerHTML=pwMeter(v)}
function focusOtp(){setTimeout(()=>{const i=cur().el.querySelector('[data-otp][data-i="0"]');i&&i.focus()},450)}
function startResend(){clearInterval(window._rs);window._rs=setInterval(()=>{const el=document.getElementById('rs');if(!el){clearInterval(window._rs);return}el.textContent=resendTxt();if(resendLeft()<=0){clearInterval(window._rs);if(['verify','fcode'].includes(S.login.mode)){const keep=[...cur().el.querySelectorAll('[data-otp]')].map(i=>i.value);refresh();cur().el.querySelectorAll('[data-otp]').forEach((i,k)=>{i.value=keep[k]||'';i.classList.toggle('filled',!!i.value)})}}},1000)}
function otpCheck(id){const boxes=[...cur().el.querySelectorAll(`[data-otp="${id}"]`)];const code=boxes.map(b=>b.value).join('');if(code.length<4)return;
boxes.forEach(b=>b.blur());
setTimeout(()=>{if(code==='1234'){boxes.forEach(b=>b.classList.add('ok'));S.login.err='';setTimeout(()=>{clearInterval(window._rs);S.login.mode=id==='signup'?'welcome':'newpass';refresh();if(id==='forgot')setTimeout(()=>{const i=cur().el.querySelector('[name=p1]');i&&i.focus()},400)},450)}
else{S.login.tries=(S.login.tries||0)+1;const left=5-S.login.tries;if(left<=0){S.login.err='Você errou 5 vezes. Por segurança, peça um novo código.';S.login.locked=true;S.login.resendAt=0}else S.login.err='Código incorreto. Você ainda tem '+left+(left>1?' tentativas.':' tentativa.');refresh();startResend();if(!S.login.locked)focusOtp()}},250)}
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||t.dataset.otp===undefined)return;t.value=t.value.replace(/\D/g,'').slice(-1);t.classList.toggle('filled',!!t.value);if(S.login.err){S.login.err='';const er=t.closest('.otp');er&&er.classList.remove('shake');er&&er.querySelectorAll('.otpbox').forEach(b=>b.classList.remove('err'))}
if(t.value){const n=t.parentElement.querySelector(`[data-i="${+t.dataset.i+1}"]`);if(n)n.focus();else otpCheck(t.dataset.otp)}});
document.addEventListener('keydown',e=>{const t=e.target;if(t.dataset&&t.dataset.otp!==undefined&&e.key==='Backspace'&&!t.value){const p=t.parentElement.querySelector(`[data-i="${+t.dataset.i-1}"]`);if(p){p.value='';p.classList.remove('filled');p.focus()}}});
document.addEventListener('paste',e=>{const t=e.target;if(!t.dataset||t.dataset.otp===undefined)return;const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,4);if(!d)return;e.preventDefault();const bs=[...t.parentElement.querySelectorAll('[data-otp]')];bs.forEach((b,k)=>{b.value=d[k]||'';b.classList.toggle('filled',!!b.value)});if(d.length===4)otpCheck(t.dataset.otp);else bs[d.length].focus()});
/* ================= reordenar paradas ================= */
document.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-grip]');if(!g||e.button>0)return;e.preventDefault();
const list=g.closest('#acts');const items=[...list.querySelectorAll('.actItem')];const from=+g.dataset.grip;const it=items[from];if(items.length<2)return;
const sc=app.getBoundingClientRect().height/app.offsetHeight;const rects=items.map(x=>x.getBoundingClientRect());const scroller=list.closest('.scroll');const s0=scroller.scrollTop;
const y0=e.clientY;let ly=y0,to=from,raf=0,moved=false;const h=rects[from].height;const mid=r=>(r.top+r.bottom)/2;
it.classList.add('dragging');list.classList.add('sorting');try{g.setPointerCapture(e.pointerId)}catch(_){}if(navigator.vibrate)navigator.vibrate(8);
const layout=()=>{const ds=scroller.scrollTop-s0;const dyc=ly-y0;it.style.transform=`translateY(${dyc/sc+ds}px)`;const c=mid(rects[from])+dyc;to=from;
items.forEach((x,k)=>{if(k===from)return;const m=mid(rects[k])-ds*sc;let sft=0;if(k>from&&c>m){sft=-h;to=Math.max(to,k)}else if(k<from&&c<m){sft=h;to=Math.min(to,k)}x.style.transform=sft?`translateY(${sft/sc}px)`:''})};
const tick=()=>{const r=scroller.getBoundingClientRect();const edge=70*sc;let v=0;if(ly<r.top+edge)v=-Math.ceil((r.top+edge-ly)/6);else if(ly>r.bottom-edge-88*sc)v=Math.ceil((ly-(r.bottom-edge-88*sc))/6);if(v){scroller.scrollTop+=v;layout()}raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick);
const mv=ev=>{ly=ev.clientY;if(Math.abs(ly-y0)>3)moved=true;layout()};
const up=()=>{cancelAnimationFrame(raf);g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);
items.forEach(x=>x.style.transform='');it.classList.remove('dragging');list.classList.remove('sorting');if(moved&&to!==from)moveAct(from,to)};
g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up)});
document.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('[data-grip]');if(!g)return;const i=+g.dataset.grip;if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();S._kbSort=true;moveAct(i,i+(e.key==='ArrowUp'?-1:1))}});
/* ================= events ================= */
document.addEventListener('change',e=>{if(e.target.dataset.file==='pmedia'){if(A._pMedia)A._pMedia(e.target.files);return}if(e.target.dataset.file!=='avatar')return;const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,256,256);S.user.photo=c.toDataURL('image/jpeg',.85);try{localStorage.setItem('mt_photo',S.user.photo)}catch(err){}refresh();if(sheetEls)refreshSheet();toast('Foto atualizada')};img.src=r.result};r.readAsDataURL(f)});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(fn){e.preventDefault();fn(el.dataset.v,el)}});
document.addEventListener('input',e=>{const k=e.target.dataset.input;if(!k)return;const v=e.target.value;
if(k==='pTxt'&&A.pTxt){A.pTxt(v);return}
if(k==='search'){S.searchQ=v;document.getElementById('searchres').innerHTML=searchResults()}
if(k==='wizq'){S.wiz.q=v;document.getElementById('wizres').innerHTML=wizRes(S.wiz)}
if(k==='stopq'&&A._stopFilter)A._stopFilter(v);
if(k==='edesc'&&A._edesc)A._edesc(v);
if(k==='beenq'&&A._beenq)A._beenq(v);
if(k==='pw')updMeter(v)});
document.addEventListener('submit',e=>{const f=e.target.dataset.form;if(!f)return;e.preventDefault();
if(f==='login'){A.loginGo('email');return}
if(f==='comment'){const v=e.target.c.value.trim();if(!v)return;if(S.guest){closeSheet(true);needAccount('comentar',null,null);return}A._comment(v);return}
if(f==='compra'){const F=e.target;const n=F.n.value.trim();if(!n)return;const raw=parseFloat((F.v.value||'0').replace(/\./g,'').replace(',','.'))||0;const st=F.store.value.trim();const t=trip(cur().params.id);t.compras.push({n,v:Math.round(raw*RATE[curDisp()]*100)/100,store:/^https?:|\.com|\.pt|\.br/.test(st)?'Link':st,link:/^https?:|\.com|\.pt|\.br/.test(st)?st:'',done:0});refresh();toast('Item adicionado à lista de compras');return}
if(f==='signup'){const F=e.target;const d={name:F.name.value.trim(),email:F.email.value.trim(),pass:F.pass.value,terms:F.terms.checked};S.login.form=d;
const err=!d.name?'Digite seu nome.':!/^\S+@\S+\.\S+$/.test(d.email)?'Digite um e-mail válido.':d.pass.length<8?'A senha precisa ter pelo menos 8 caracteres.':!d.terms?'Aceite os termos para continuar.':'';
if(err){S.login.err=err;refresh();const g=cur().el.querySelector('.lg-sheet form');g.pass.value=d.pass;g.terms.checked=d.terms;updMeter(d.pass);return}
S.login.err='';S.login.loading=true;refresh();setTimeout(()=>{S.login.loading=false;S.login.email=d.email;S.login.mode='verify';S.login.tries=0;S.login.locked=false;S.login.resendAt=Date.now()+30000;refresh();focusOtp();startResend();toast('Código enviado para '+d.email)},900);return}
if(f==='forgot'){const em=e.target.email.value.trim();if(!/^\S+@\S+\.\S+$/.test(em)){S.login.err='Digite um e-mail válido.';refresh();return}S.login.err='';S.login.loading=true;refresh();setTimeout(()=>{S.login.loading=false;S.login.email=em;S.login.mode='fcode';S.login.tries=0;S.login.locked=false;S.login.resendAt=Date.now()+30000;refresh();focusOtp();startResend();toast('Código enviado para '+em)},900);return}
if(f==='newpass'){const a=e.target.p1.value,b=e.target.p2.value;const err=a.length<8?'A senha precisa ter pelo menos 8 caracteres.':a!==b?'As senhas não conferem.':'';if(err){S.login.err=err;refresh();const g=cur().el.querySelector('.lg-sheet form');g.p1.value=a;g.p2.value=b;updMeter(a);return}
S.login.err='';S.login.loading=true;refresh();setTimeout(()=>{S.login.loading=false;S.login.mode='fdone';refresh()},900);return}

if(f==='profile'){const d=new FormData(e.target);['name','handle','city','link','bio'].forEach(k=>S.user[k]=String(d.get(k)||'').trim()||S.user[k]);S.user.handle=S.user.handle.replace(/^@/,'');closeSheet();setTimeout(()=>{refresh();toast('Perfil atualizado')},200);return}
if(f==='postEdit'){const x=S.myPosts.find(p=>p.id==e.target.dataset.id);x.txt=e.target.txt.value.trim()||x.txt;closeSheet();setTimeout(()=>{refresh();toast('Legenda atualizada')},200);return}
if(f==='chat'){const v=e.target.m.value.trim();if(v)ask(v)}
if(f==='mala'){const v=e.target.item.value.trim();if(!v)return;const t=trip(cur().params.id);t.mala[t.mala.length-1].it.push([v,0]);refresh();toast('Item adicionado');setTimeout(()=>{const i=cur().el.querySelector('[name=item]');i&&i.focus()},50)}
if(f==='invite'){const v=e.target.email.value.trim();if(!/^\S+@\S+\.\S+$/.test(v)){toast('Digite um e-mail válido');return}A._invite(v)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(sheetEls)closeSheet();else if(S.stack.length>1)cur().name==='wizard'?A.wclose():pop()}});

/* ================= jump (side panel) ================= */
function jump(v){closeSheet(true);if(S.guest&&v!=='reset'){S.guest=false;if(S._trips){S.trips=S._trips;S._trips=null}}
if(v==='reset'){try{localStorage.removeItem('mt_session')}catch(e){}S=freshState();boot();return}
if(v==='signup'){try{localStorage.removeItem('mt_session')}catch(e){}S=freshState();boot();clearTimeout(window._sp);S.login.mode='signup';rootTo('login',true);return}
const go=fn=>{if(S.tab!=='home'||S.stack.length>1){rootTo('home',true)}setTimeout(fn,60)};
if(v==='wizard')go(()=>A.wizard());
if(v==='roteiro')go(()=>{const t=trip('roma');t.tab='roteiro';t.day=0;push('trip',{id:'roma'})});
if(v==='gasto')go(()=>{const t=trip('roma');t.tab='gastos';push('trip',{id:'roma'});setTimeout(()=>openExpense(),540)});
if(v==='feed'){rootTo('explore');setTimeout(()=>toast('Toque em “+ Roteiro” num vídeo'),500)}
if(v==='maya')go(()=>openMaya());
}

/* ================= fit ================= */
function fit(){const d=document.getElementById('device');if(innerWidth<=520){d.style.transform='';return}const s=Math.min(1,(innerHeight-32)/864);d.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();boot();
</script>
