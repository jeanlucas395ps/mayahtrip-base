<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comparação dos bancos — MayahTrip</title>
  <style>
    :root {
      --ink: #15122e;
      --mut: #5e5a73;
      --bg: #f4f3f8;
      --card: #ffffff;
      --line: #e5e3ec;
      --lime: #c9ff27;
      --pri: #2b207f;
      --ok: #3a6b00;
      --bad: #962a10;
      --warn: #8a5a00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 "Avenir Next", "Segoe UI", sans-serif;
    }
    header {
      padding: 28px 32px 8px;
    }
    h1 {
      margin: 0 0 6px;
      font-family: Palatino, "Iowan Old Style", Georgia, serif;
      font-weight: 500;
      font-size: 34px;
      letter-spacing: -0.03em;
    }
    header p { margin: 0; color: var(--mut); max-width: 760px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 20px 32px;
    }
    .stat {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .stat b { display: block; font-size: 28px; letter-spacing: -0.04em; }
    .stat span { color: var(--mut); font-size: 13px; }
    .bar {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 0 32px 16px;
      flex-wrap: wrap;
    }
    button.chip, input {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
    }
    button.chip[aria-pressed="true"] {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }
    input { min-width: 240px; border-radius: 12px; }
    main {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      padding: 0 32px 40px;
      align-items: start;
    }
    .list, .detail {
      background: var(--card);
      border-radius: 20px;
    }
    .list { padding: 8px; max-height: calc(100vh - 40px); overflow: auto; position: sticky; top: 16px; }
    button.row {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      color: inherit;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }
    button.row[aria-current="true"] { background: #f1effa; }
    button.row small { color: var(--mut); }
    .pill {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      border-radius: 999px;
      padding: 3px 8px;
      white-space: nowrap;
    }
    .igual { background: #eef8d8; color: var(--ok); }
    .regra { background: #e7e4f8; color: var(--pri); }
    .diverge { background: #fff1d6; color: var(--warn); }
    .nosso { background: var(--lime); color: var(--ink); }
    .enviado { background: #f8e4df; color: var(--bad); }
    .detail { padding: 22px 24px 28px; }
    .detail h2 { margin: 0 0 8px; font-size: 22px; }
    .note { color: var(--mut); margin: 0 0 18px; }
    .cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .cols section { background: var(--bg); border-radius: 14px; padding: 12px 14px; }
    .cols h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--mut); }
    .cols li { margin: 4px 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    ul { margin: 0; padding-left: 18px; }
    .empty { color: var(--mut); list-style: none; margin-left: -18px; }
    @media (max-width: 980px) {
      .stats, main { grid-template-columns: 1fr; }
      .list { position: static; max-height: 320px; }
      .cols { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Dois bancos, um produto</h1>
    <p>O arquivo enviado contra <code>mayahtrip.sql</code>, lido de BUSINESS/, PANEL/ e TECH/TECH.md em 18 nov 2026. Coluna igual é o mesmo nome. O que ainda está em aberto não foi criado no nosso para antecipar a decisão.</p>
  </header>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <button class="chip" data-kind="todos" aria-pressed="true">Tudo</button>
    <button class="chip" data-kind="diverge">Diverge</button>
    <button class="chip" data-kind="nosso">Só no nosso</button>
    <button class="chip" data-kind="enviado">Só no enviado</button>
    <button class="chip" data-kind="regra">Mesma coluna, outra regra</button>
    <button class="chip" data-kind="igual">Iguais</button>
    <input id="q" placeholder="Buscar tabela ou coluna" />
  </div>
  <main>
    <div class="list" id="list"></div>
    <div class="detail" id="detail"></div>
  </main>

    const counts = {"tabelasNossas":127,"tabelasEnviadas":120,"igual":73,"regra":3,"diverge":40,"nosso":11,"enviado":4};
    const labels = { igual: 'Igual', regra: 'Outra regra', diverge: 'Diverge', nosso: 'Só no nosso', enviado: 'Só no enviado' };
    const stats = document.getElementById('stats');
    stats.innerHTML = [
      [counts.tabelasNossas, 'Tabelas no nosso'],
      [counts.tabelasEnviadas, 'Tabelas no enviado'],
      [counts.diverge, 'Mesmo nome, colunas diferentes'],
      [counts.nosso + counts.enviado, 'Tabelas só de um lado'],
    ].map(([n, label]) => '<div class="stat"><b>' + n + '</b><span>' + label + '</span></div>').join('');

    let kind = 'todos';
    let q = '';
    let current = rows.find((r) => r.kind === 'diverge')?.key ?? rows[0].key;

    function visible() {
      return rows.filter((r) => {
        if (kind !== 'todos' && r.kind !== kind) return false;
        if (!q) return true;
        const blob = (r.key + ' ' + r.onlyOurs.join(' ') + ' ' + r.onlyTheirs.join(' ') + ' ' + r.both.join(' ') + ' ' + r.note).toLowerCase();
        return blob.includes(q);
      });
    }

    function listOf(items, empty) {
      if (!items.length) return '<li class="empty">' + empty + '</li>';
      return items.map((c) => '<li>' + c + '</li>').join('');
    }

    function render() {
      const shown = visible();
      if (!shown.some((r) => r.key === current) && shown[0]) current = shown[0].key;
      document.getElementById('list').innerHTML = shown.map((r) =>
        '<button class="row" data-key="' + r.key + '"' + (r.key === current ? ' aria-current="true"' : '') + '><span><small>' + r.schema + '</small><br>' + r.key.split('.')[1] + '</span><span class="pill ' + r.kind + '">' + labels[r.kind] + '</span></button>'
      ).join('') || '<p class="note">Nenhuma tabela com esse filtro.</p>';
      const r = rows.find((row) => row.key === current);
      document.getElementById('detail').innerHTML = r ? (
        '<h2>' + r.key + '</h2>' +
        '<p><span class="pill ' + r.kind + '">' + labels[r.kind] + '</span></p>' +
        '<p class="note">' + (r.note || 'Mesmas colunas de nome, ou a tabela só existe de um lado.') + '</p>' +
        '<div class="cols">' +
          '<section><h3>Só no enviado</h3><ul>' + listOf(r.onlyTheirs, 'Nenhuma') + '</ul></section>' +
          '<section><h3>Nos dois</h3><ul>' + listOf(r.both, 'Nenhuma') + '</ul></section>' +
          '<section><h3>Só no nosso</h3><ul>' + listOf(r.onlyOurs, 'Nenhuma') + '</ul></section>' +
        '</div>'
      ) : '';
    }

    document.querySelector('.bar').addEventListener('click', (event) => {
      const chip = event.target.closest('[data-kind]');
      if (!chip) return;
      kind = chip.dataset.kind;
      for (const button of document.querySelectorAll('.chip')) button.setAttribute('aria-pressed', String(button === chip));
      render();
    });
    document.getElementById('q').addEventListener('input', (event) => {
      q = event.target.value.trim().toLowerCase();
      render();
    });
    document.getElementById('list').addEventListener('click', (event) => {
      const button = event.target.closest('[data-key]');
      if (!button) return;
      current = button.dataset.key;
      render();
    });
    render();
  </script>
